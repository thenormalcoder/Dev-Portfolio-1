<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="JetBrains Mono, monospace">
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <radialGradient id="glow" cx="70%" cy="50%" r="55%">
      <stop offset="0" stop-color="#f2b25c" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#0b0f14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ec4b6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5ec4b6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="#0b0f14"/>
  <rect width="1280" height="720" fill="url(#g)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>

  <text x="80" y="110" fill="#9aa4b2" font-size="22">// internet-booking-engine</text>
  <text x="80" y="160" fill="#e8eaed" font-size="44" font-weight="700" font-family="Sora, sans-serif">Multi-tenant · High concurrency</text>

  <!-- availability calendar -->
  <g font-size="18">
    <rect x="80" y="220" width="520" height="420" rx="18" fill="#121821" stroke="#232d3a" stroke-width="2"/>
    <text x="112" y="268" fill="#e8eaed" font-size="22" font-weight="700">Rooms · Mar 2026</text>
    <g fill="#9aa4b2" text-anchor="middle">
      <text x="140" y="312">M</text><text x="204" y="312">T</text><text x="268" y="312">W</text>
      <text x="332" y="312">T</text><text x="396" y="312">F</text><text x="460" y="312">S</text><text x="524" y="312">S</text>
    </g>
    <g>
      <!-- row 1 -->
      <rect x="114" y="330" width="52" height="52" rx="10" fill="#18202b"/>
      <rect x="178" y="330" width="52" height="52" rx="10" fill="#18202b"/>
      <rect x="242" y="330" width="52" height="52" rx="10" fill="#5ec4b6" fill-opacity="0.25" stroke="#5ec4b6"/>
      <rect x="306" y="330" width="52" height="52" rx="10" fill="#5ec4b6" fill-opacity="0.25" stroke="#5ec4b6"/>
      <rect x="370" y="330" width="52" height="52" rx="10" fill="#5ec4b6" fill-opacity="0.25" stroke="#5ec4b6"/>
      <rect x="434" y="330" width="52" height="52" rx="10" fill="#18202b"/>
      <rect x="498" y="330" width="52" height="52" rx="10" fill="#18202b"/>
      <!-- row 2 -->
      <rect x="114" y="394" width="52" height="52" rx="10" fill="#18202b"/>
      <rect x="178" y="394" width="52" height="52" rx="10" fill="#f2b25c" fill-opacity="0.25" stroke="#f2b25c"/>
      <rect x="242" y="394" width="52" height="52" rx="10" fill="#f2b25c" fill-opacity="0.25" stroke="#f2b25c"/>
      <rect x="306" y="394" width="52" height="52" rx="10" fill="#18202b"/>
      <rect x="370" y="394" width="52" height="52" rx="10" fill="#18202b"/>
      <rect x="434" y="394" width="52" height="52" rx="10" fill="#5ec4b6" fill-opacity="0.25" stroke="#5ec4b6"/>
      <rect x="498" y="394" width="52" height="52" rx="10" fill="#5ec4b6" fill-opacity="0.25" stroke="#5ec4b6"/>
      <!-- row 3 -->
      <rect x="114" y="458" width="52" height="52" rx="10" fill="#18202b"/>
      <rect x="178" y="458" width="52" height="52" rx="10" fill="#18202b"/>
      <rect x="242" y="458" width="52" height="52" rx="10" fill="#18202b"/>
      <rect x="306" y="458" width="52" height="52" rx="10" fill="#f2b25c" fill-opacity="0.25" stroke="#f2b25c"/>
      <rect x="370" y="458" width="52" height="52" rx="10" fill="#f2b25c" fill-opacity="0.25" stroke="#f2b25c"/>
      <rect x="434" y="458" width="52" height="52" rx="10" fill="#f2b25c" fill-opacity="0.25" stroke="#f2b25c"/>
      <rect x="498" y="458" width="52" height="52" rx="10" fill="#18202b"/>
    </g>
    <rect x="114" y="550" width="18" height="18" rx="4" fill="#5ec4b6" fill-opacity="0.25" stroke="#5ec4b6"/>
    <text x="142" y="565" fill="#9aa4b2">booked</text>
    <rect x="250" y="550" width="18" height="18" rx="4" fill="#f2b25c" fill-opacity="0.25" stroke="#f2b25c"/>
    <text x="278" y="565" fill="#9aa4b2">held (locked)</text>
    <text x="114" y="610" fill="#5ec4b6">✓ no double bookings</text>
  </g>

  <!-- load test panel -->
  <g font-size="20">
    <rect x="680" y="220" width="520" height="420" rx="18" fill="#121821" stroke="#232d3a" stroke-width="2"/>
    <text x="712" y="268" fill="#9aa4b2">$ jmeter -n -t load.jmx</text>
    <path d="M712 560H1168" stroke="#232d3a" stroke-width="2"/>
    <path d="M712 470H1168" stroke="#232d3a" stroke-width="1" stroke-dasharray="6 8"/>
    <text x="1168" y="460" fill="#f2b25c" font-size="16" text-anchor="end">500ms SLA</text>
    <path d="M712 540 L770 520 L828 530 L886 505 L944 515 L1002 498 L1060 508 L1118 494 L1168 500 L1168 560 L712 560Z" fill="url(#area)"/>
    <path d="M712 540 L770 520 L828 530 L886 505 L944 515 L1002 498 L1060 508 L1118 494 L1168 500" fill="none" stroke="#5ec4b6" stroke-width="3"/>
    <text x="712" y="330" fill="#e8eaed" font-size="40" font-weight="700" font-family="Sora, sans-serif">1000+</text>
    <text x="712" y="362" fill="#9aa4b2" font-size="18">concurrent users</text>
    <text x="960" y="330" fill="#5ec4b6" font-size="40" font-weight="700" font-family="Sora, sans-serif">&lt;500ms</text>
    <text x="960" y="362" fill="#9aa4b2" font-size="18">latency</text>
    <text x="712" y="606" fill="#9aa4b2" font-size="17">ECS · Service Connect · Cognito · Terraform</text>
  </g>
</svg>
